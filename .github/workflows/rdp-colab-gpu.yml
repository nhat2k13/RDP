name: nhat

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $password = "Pzkxvu123@"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Start Serveo TCP Tunnel
        run: |
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -R 0:localhost:3389 serveo.net > serveo.log 2>&1" -PassThru
          
          $serveoIP = ""
          $retries = 0
          while (-not $serveoIP -and $retries -lt 15) {
              Start-Sleep -Seconds 3
              if (Test-Path "serveo.log") {
                  $log = Get-Content serveo.log -Raw
                  if ($log -match 'Forwarding TCP traffic from ([a-zA-Z0-9\.\-]+\:[0-9]+)') {
                      $serveoIP = $matches[1]
                      break
                  }
              }
              $retries++
          }
          
          if (-not $serveoIP) {
              Write-Host "--- SERVEO LOG ---"
              if (Test-Path "serveo.log") { Get-Content serveo.log }
              Write-Error "Khong the khoi tao Serveo Tunnel."
              exit 1
          }
          echo "SERVEO_IP=$serveoIP" >> $env:GITHUB_ENV

      - name: Maintain Connection
        run: |
          Write-Host "`n==============================================="
          Write-Host "DIA CHI RDP : $env:SERVEO_IP"
          Write-Host "USERNAME    : RDP"
          Write-Host "PASSWORD    : $env:RDP_PASS"
          Write-Host "===============================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Cancel workflow run to terminate"
              Start-Sleep -Seconds 300
          }
