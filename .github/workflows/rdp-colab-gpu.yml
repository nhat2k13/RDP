name: ??

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $username = "nhat"
          $password = "Pzkxvu123@"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          
          echo "RDP_USER=$username" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Start LocalTunnel
        run: |
          npm install -g localtunnel
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c lt --port 3389 > lt.log 2>&1" -PassThru
          
          $cleanUrl = ""
          $retries = 0
          while ($retries -lt 15) {
              Start-Sleep -Seconds 2
              if (Test-Path "lt.log") {
                  $log = Get-Content lt.log -Raw
                  if ($log -match 'https://[a-zA-Z0-9\.\-]+\.loca\.lt') {
                      $cleanUrl = $matches[0] -replace "https://", ""
                      break
                  }
              }
              $retries++
          }
          
          # Neu LocalTunnel cham, fallback sang nokey
          if (-not $cleanUrl) {
              Invoke-WebRequest https://github.com/nokey-io/nokey/releases/latest/download/nokey_windows_amd64.exe -OutFile nokey.exe
              Start-Process -FilePath ".\nokey.exe" -ArgumentList "3389" -RedirectStandardOutput "nokey.log" -PassThru
              Start-Sleep -Seconds 5
              $cleanUrl = (Get-Content nokey.log -Raw) -replace ".*tcp://", ""
          }

          echo "RDP_URL=$cleanUrl" >> $env:GITHUB_ENV

      - name: Maintain Connection
        run: |
          Write-Host "`n==============================================="
          Write-Host "DIA CHI RDP : $env:RDP_URL"
          Write-Host "USERNAME    : $env:RDP_USER"
          Write-Host "PASSWORD    : $env:RDP_PASS"
          Write-Host "===============================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Cancel workflow run to terminate"
              Start-Sleep -Seconds 300
          }
