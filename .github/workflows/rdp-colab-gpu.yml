name: RDP-Windows-Colab-Direct

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: self-hosted
    timeout-minutes: 360

    steps:
      - name: Khai tử tiến trình cũ & Khởi chạy Windows
        run: |
          # 1. Dọn dẹp hệ thống
          sudo killall -9 qemu-system-x86_64 dockerd tailscaled apt apt-get dpkg 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock* /var/cache/apt/archives/lock
          sudo dpkg --configure -a

          # 2. Cài Docker & Tailscale
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io curl

          curl -fsSL https://tailscale.com/install.sh | sh
          sudo mkdir -p /dev/net
          sudo mknod /dev/net/tun c 10 200 2>/dev/null || true
          sudo chmod 600 /dev/net/tun 2>/dev/null || true

          # 3. Chạy Tailscale
          sudo tailscaled --tun=userspace-networking --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock &
          sleep 4
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=colab-win-$GITHUB_RUN_ID

          TS_IP=$(tailscale ip -4)

          # 4. Chạy Docker Daemon ngầm
          sudo dockerd > /dev/null 2>&1 &
          sleep 5

          echo -e "\n=========================================="
          echo "   KẾT NỐI WINDOWS BẰNG TRÌNH DUYỆT WEB"
          echo "Địa chỉ URL : http://$TS_IP:8006"
          echo "==========================================\n"

          # 5. Khởi chạy Windows Container (Đã bỏ KVM bắt buộc)
          sudo docker run -d \
            --name windows \
            -p 8006:8006 \
            -e RAM_SIZE="4G" \
            -e CPU_CORES="2" \
            dockur/windows

          while true; do
            echo "[$(date)] Máy ảo Windows đang chạy tại http://$TS_IP:8006..."
            sleep 300
          done
