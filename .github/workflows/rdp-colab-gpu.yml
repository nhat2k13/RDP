name: nhat

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $password = "Pzkxvu123@"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Start Pinggy TCP Tunnel
        run: |
          $sshCmd = "ssh -o StrictHostKeyChecking=no -p 443 -R0:localhost:3389 tcp@a.pinggy.io"
          Start-Process -FilePath "cmd.exe" -ArgumentList "/c $sshCmd > pinggy.log 2>&1" -PassThru
          
          $pinggyIP = ""
          $retries = 0
          while (-not $pinggyIP -and $retries -lt 15) {
              Start-Sleep -Seconds 3
              if (Test-Path "pinggy.log") {
                  $log = Get-Content pinggy.log -Raw
                  if ($log -match 'tcp://([a-zA-Z0-9\.\-]+\:[0-9]+)') {
                      $pinggyIP = $matches[1]
                      break
                  }
              }
              $retries++
          }
          
          if (-not $pinggyIP) {
              Write-Host "--- PINGGY LOG ---"
              if (Test-Path "pinggy.log") { Get-Content pinggy.log }
              Write-Error "Khong the khoi tao Pinggy Tunnel."
              exit 1
          }
          echo "PINGGY_IP=$pinggyIP" >> $env:GITHUB_ENV

      - name: Maintain Connection
        run: |
          Write-Host "`n==============================================="
          Write-Host "DIA CHI RDP : $env:PINGGY_IP"
          Write-Host "USERNAME    : RDP"
          Write-Host "PASSWORD    : $env:RDP_PASS"
          Write-Host "===============================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Cancel workflow run to terminate"
              Start-Sleep -Seconds 300
          }
