name: nhat1

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Check Location Washington First
        run: |
          $loc = (curl.exe -s https://ipinfo.io/json | ConvertFrom-Json)
          Write-Host "Khu vuc hien tai: $($loc.city), $($loc.region) - $($loc.country)"
          if ($loc.region -ne "Washington") {
              Write-Error "Khong phai may o Washington! Huy ngay de tiet kiem Key Tailscale..."
              exit 1
          }

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Custom Password
        run: |
          $username = "nhat"
          $password = "Pzkxvu123@"
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          
          echo "RDP_USER=$username" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Download and Install UgPhone, VMOS Cloud, and VSPhone
        run: |
          $desktop = "C:\Users\Public\Desktop"

          # 1. Tải và cài đặt UgPhone
          Write-Host "Dang tai UgPhone..."
          $ugUrl = "https://download.ugphone.com/UgPhone_setup.exe"
          $ugPath = Join-Path $env:TEMP "UgPhone_setup.exe"
          Invoke-WebRequest -Uri $ugUrl -OutFile $ugPath -UserAgent "Mozilla/5.0"
          Start-Process -FilePath $ugPath -ArgumentList "/S" -Wait
          Remove-Item $ugPath -Force

          # 2. Tải và cài đặt VMOS Cloud
          Write-Host "Dang tai VMOS Cloud..."
          $vmosUrl = "https://www.vmos.com/download/VMOSCloud_setup.exe"
          $vmosPath = Join-Path $env:TEMP "VMOSCloud_setup.exe"
          Invoke-WebRequest -Uri $vmosUrl -OutFile $vmosPath -UserAgent "Mozilla/5.0"
          Start-Process -FilePath $vmosPath -ArgumentList "/S" -Wait
          Remove-Item $vmosPath -Force

          # 3. Tải và cài đặt VSPhone
          Write-Host "Dang tai VSPhone..."
          $vsUrl = "https://download.vsphone.com/VSPhone_setup.exe"
          $vsPath = Join-Path $env:TEMP "VSPhone_setup.exe"
          Invoke-WebRequest -Uri $vsUrl -OutFile $vsPath -UserAgent "Mozilla/5.0"
          Start-Process -FilePath $vsPath -ArgumentList "/S" -Wait
          Remove-Item $vsPath -Force

          Write-Host "Da cai dat xong UgPhone, VMOS Cloud va VSPhone!"

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path $env:TEMP "tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          $tsExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tsExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Verify RDP Accessibility
        run: |
          Write-Host "Tailscale IP: $env:TAILSCALE_IP"
          
          $testResult = Test-NetConnection -ComputerName $env:TAILSCALE_IP -Port 3389
          if (-not $testResult.TcpTestSucceeded) {
              Write-Error "TCP connection to RDP port 3389 failed"
              exit 1
          }
          Write-Host "TCP connectivity successful!"

      - name: Download Photo and Auto Set Wallpaper on Login
        run: |
          $imgPath = "C:\Users\Public\victory.jpg"
          Invoke-WebRequest -Uri "https://files.catbox.moe/lb40wl.jpg" -OutFile $imgPath
          
          $psScript = @"
          Set-ItemProperty -Path 'HKCU:\Control Panel\Desktop' -Name Wallpaper -Value '$imgPath'
          Add-Type -TypeDefinition 'using System.Runtime.InteropServices; public class Wallpaper { [DllImport("user32.dll", CharSet = CharSet.Auto)] public static extern int SystemParametersInfo(int uAction, int uParam, string lpvParam, int fuWinIni); }'
          [Wallpaper]::SystemParametersInfo(0x0014, 0, '$imgPath', 0x01 -bor 0x02)
          "@
          
          $psFilePath = "C:\Users\Public\set_wallpaper.ps1"
          $psScript | Out-File -FilePath $psFilePath -Encoding ascii
          
          $startupFolder = "C:\ProgramData\Microsoft\Windows\Start Menu\Programs\StartUp"
          $batPath = "$startupFolder\set_wallpaper.bat"
          "powershell -ExecutionPolicy Bypass -File `"$psFilePath`"" | Out-File -FilePath $batPath -Encoding ascii

      - name: Maintain Connection
        run: |
          Write-Host "`n=== RDP ACCESS ==="
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : $env:RDP_USER"
          Write-Host "Password : $env:RDP_PASS"
          Write-Host "==================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Cancel workflow run to terminate"
              Start-Sleep -Seconds 300
          }
