name: Windows-10-QEMU-RDP

on:
  workflow_dispatch:

jobs:
  windows-vm:
    runs-on: self-hosted
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. Cài QEMU + công cụ cần thiết
      # =========================================================
      - name: Install QEMU
        shell: bash
        run: |
          set -e

          sudo pkill -9 apt apt-get dpkg 2>/dev/null || true

          sudo rm -f \
            /var/lib/apt/lists/lock \
            /var/lib/dpkg/lock \
            /var/lib/dpkg/lock-frontend \
            /var/cache/apt/archives/lock

          sudo dpkg --configure -a || true

          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            xorriso \
            curl \
            wget \
            unzip \
            net-tools

      # =========================================================
      # 2. Kiểm tra KVM
      # =========================================================
      - name: Check KVM
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then
            echo "KVM OK"
            ls -l /dev/kvm
          else
            echo "WARNING: /dev/kvm không tồn tại."
            echo "VM sẽ phải chạy bằng software emulation và rất chậm."
          fi

      # =========================================================
      # 3. Cấu hình múi giờ
      # =========================================================
      - name: Configure timezone
        shell: bash
        run: |
          sudo timedatectl set-timezone Asia/Ho_Chi_Minh || true
          date

      # =========================================================
      # 4. Cài Tailscale
      # =========================================================
      - name: Install Tailscale
        shell: bash
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          sudo mkdir -p /dev/net

          if [ ! -e /dev/net/tun ]; then
            sudo mknod /dev/net/tun c 10 200 || true
          fi

          sudo chmod 600 /dev/net/tun || true

          sudo tailscaled \
            --tun=userspace-networking \
            --state=/var/lib/tailscale/tailscaled.state \
            --socket=/var/run/tailscale/tailscaled.sock &

          sleep 5

          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="windows10-$GITHUB_RUN_ID"

          TS_IP=$(sudo tailscale ip -4)

          if [ -z "$TS_IP" ]; then
            echo "Không lấy được Tailscale IP"
            exit 1
          fi

          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

      # =========================================================
      # 5. Tải Windows ISO
      #
      # Tạo GitHub Secret:
      # WINDOWS_ISO_URL
      #
      # Nên dùng ISO Windows mà bạn có quyền sử dụng.
      # =========================================================
      - name: Download Windows ISO
        shell: bash
        run: |
          set -e

          mkdir -p "$HOME/windows-vm"
          cd "$HOME/windows-vm"

          if [ -z "${{ secrets.WINDOWS_ISO_URL }}" ]; then
            echo "Thiếu secret WINDOWS_ISO_URL"
            exit 1
          fi

          wget -O windows.iso "${{ secrets.WINDOWS_ISO_URL }}"

          ls -lh windows.iso

      # =========================================================
      # 6. Tạo ổ cứng Windows
      # =========================================================
      - name: Create Windows disk
        shell: bash
        run: |
          set -e

          cd "$HOME/windows-vm"

          if [ ! -f windows.qcow2 ]; then
            qemu-img create \
              -f qcow2 \
              windows.qcow2 \
              80G
          fi

          qemu-img info windows.qcow2

      # =========================================================
      # 7. Tạo UEFI variables
      # =========================================================
      - name: Prepare UEFI
        shell: bash
        run: |
          set -e

          cd "$HOME/windows-vm"

          cp /usr/share/OVMF/OVMF_VARS.fd ./OVMF_VARS.fd

      # =========================================================
      # 8. Tạo script khởi động Windows VM
      # =========================================================
      - name: Create VM launcher
        shell: bash
        run: |
          cat > "$HOME/windows-vm/start-windows.sh" <<'EOF'
          #!/bin/bash

          set -e

          cd "$HOME/windows-vm"

          if [ -e /dev/kvm ]; then
            ACCEL="-enable-kvm"
            CPU="host"
          else
            ACCEL=""
            CPU="qemu64"
          fi

          nohup qemu-system-x86_64 \
            $ACCEL \
            -machine q35 \
            -cpu "$CPU" \
            -smp 4 \
            -m 8G \
            -drive "if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd" \
            -drive "if=pflash,format=raw,file=$HOME/windows-vm/OVMF_VARS.fd" \
            -drive "file=$HOME/windows-vm/windows.qcow2,if=virtio,format=qcow2" \
            -cdrom "$HOME/windows-vm/windows.iso" \
            -boot order=d \
            -device virtio-net-pci,netdev=net0 \
            -netdev "user,id=net0,hostfwd=tcp:127.0.0.1:3389-:3389" \
            -display none \
            -vnc 127.0.0.1:5900 \
            -monitor none \
            > "$HOME/windows-vm/qemu.log" 2>&1 &

          echo $! > "$HOME/windows-vm/qemu.pid"

          echo "QEMU PID: $(cat "$HOME/windows-vm/qemu.pid")"
          EOF

          chmod +x "$HOME/windows-vm/start-windows.sh"

      # =========================================================
      # 9. Khởi động Windows
      # =========================================================
      - name: Start Windows 10 VM
        shell: bash
        run: |
          "$HOME/windows-vm/start-windows.sh"

          sleep 10

          if ! kill -0 "$(cat "$HOME/windows-vm/qemu.pid")" 2>/dev/null; then
            echo "QEMU không chạy."
            cat "$HOME/windows-vm/qemu.log"
            exit 1
          fi

          echo "Windows VM đang chạy."

      # =========================================================
      # 10. Hiển thị thông tin
      # =========================================================
      - name: Connection information
        shell: bash
        run: |
          echo ""
          echo "=============================================="
          echo "        WINDOWS 10 QEMU VM"
          echo "=============================================="
          echo ""
          echo "Tailscale IP:"
          echo "$TS_IP"
          echo ""
          echo "VNC:"
          echo "$TS_IP:5900"
          echo ""
          echo "RDP:"
          echo "$TS_IP:3389"
          echo ""
          echo "Disk:"
          echo "$HOME/windows-vm/windows.qcow2"
          echo ""
          echo "=============================================="

      # =========================================================
      # 11. Giữ VM chạy
      # =========================================================
      - name: Keep VM alive
        shell: bash
        run: |
          while kill -0 "$(cat "$HOME/windows-vm/qemu.pid")" 2>/dev/null; do
            echo "[$(date)] Windows 10 VM đang chạy..."
            sleep 300
          done

          echo "Windows VM đã dừng."

      # =========================================================
      # 12. Log khi lỗi
      # =========================================================
      - name: Show QEMU log
        if: always()
        shell: bash
        run: |
          if [ -f "$HOME/windows-vm/qemu.log" ]; then
            echo "========== QEMU LOG =========="
            cat "$HOME/windows-vm/qemu.log"
          fi
