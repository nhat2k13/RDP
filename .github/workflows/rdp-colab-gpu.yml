name: nhat

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    strategy:
      matrix:
        runner-node: [1, 2, 3, 4, 5]
      fail-fast: false

    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Check Location Washington First
        run: |
          $loc = (curl.exe -s https://ipinfo.io/json | ConvertFrom-Json)
          Write-Host "Khu vuc hien tai: $($loc.city), $($loc.region) - $($loc.country)"
          if ($loc.region -ne "Washington") {
              Write-Error "Khong phai may o Washington! Huy luong nay de nhuong cho luong khac..."
              exit 1
          }

      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Tailscale"
          netsh advfirewall firewall add rule name="RDP-Tailscale" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Custom Password
        run: |
          $username = "nhat"
          $password = "Pzkxvu123@"
          
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          
          echo "RDP_USER=$username" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Download and Install UgPhone, VMOS Cloud, and VSPhone
        run: |
          # 1. Tải UgPhone
          try {
              $ugUrl = "https://www.ugphone.com/download/UgPhone-setup.exe"
              $ugPath = Join-Path $env:TEMP "UgPhone_setup.exe"
              Invoke-WebRequest -Uri $ugUrl -OutFile $ugPath -UserAgent "Mozilla/5.0"
              Start-Process -FilePath $ugPath -ArgumentList "/S" -Wait
          } catch { Write-Host "Loi tai UgPhone..." }

          # 2. Tải VMOS Cloud
          try {
              $vmosUrl = "https://file.vmos.com/vmoscloud/VMOSCloud_setup.exe"
              $vmosPath = Join-Path $env:TEMP "VMOSCloud_setup.exe"
              Invoke-WebRequest -Uri $vmosUrl -OutFile $vmosPath -UserAgent "Mozilla/5.0"
              Start-Process -FilePath $vmosPath -ArgumentList "/S" -Wait
          } catch { Write-Host "Loi tai VMOS Cloud..." }

          # 3. Tải VSPhone
          try {
              $vsUrl = "https://www.vsphone.com/download/VSPhone_setup.exe"
              $vsPath = Join-Path $env:TEMP "VSPhone_setup.exe"
              Invoke-WebRequest -Uri $vsUrl -OutFile $vsPath -UserAgent "Mozilla/5.0"
              Start-Process -FilePath $vsPath -ArgumentList "/S" -Wait
          } catch { Write-Host "Loi tai VSPhone..." }

      - name: Install Tailscale
        run: |
          $tsUrl = "https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi"
          $installerPath = Join-Path $env:TEMP "tailscale.msi"
          
          Invoke-WebRequest -Uri $tsUrl -OutFile $installerPath
          Start-Process msiexec.exe -ArgumentList "/i", "`"$installerPath`"", "/quiet", "/norestart" -Wait
          Remove-Item $installerPath -Force

      - name: Establish Tailscale Connection
        run: |
          $tsExe = Join-Path $env:ProgramFiles "Tailscale\tailscale.exe"
          & $tsExe up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=gh-runner-$env:GITHUB_RUN_ID
          
          $tsIP = $null
          $retries = 0
          while (-not $tsIP -and $retries -lt 10) {
              $tsIP = & $tsExe ip -4
              Start-Sleep -Seconds 5
              $retries++
          }
          
          if (-not $tsIP) {
              Write-Error "Tailscale IP not assigned. Exiting."
              exit 1
          }
          echo "TAILSCALE_IP=$tsIP" >> $env:GITHUB_ENV

      - name: Maintain Connection
        run: |
          Write-Host "`n=== MAY WASHINGTON DA SAN THANH CONG ==="
          Write-Host "Address  : $env:TAILSCALE_IP"
          Write-Host "Username : $env:RDP_USER"
          Write-Host "Password : $env:RDP_PASS"
          Write-Host "========================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Washington Node"
              Start-Sleep -Seconds 300
          }
