name: RDP-Windows-Colab-Direct

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: self-hosted
    timeout-minutes: 360

    steps:
      - name: Khởi động Windows RDP
        run: |
          # 1. Dọn dẹp & Cài đặt công cụ
          sudo killall -9 qemu-system-x86_64 apt apt-get dpkg 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock* /var/cache/apt/archives/lock
          sudo dpkg --configure -a

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-system-x86 qemu-utils wget curl

          # 2. Cài đặt và Bật Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo mkdir -p /dev/net
          sudo mknod /dev/net/tun c 10 200 2>/dev/null || true
          sudo chmod 600 /dev/net/tun 2>/dev/null || true

          sudo killall tailscaled 2>/dev/null || true
          sleep 2
          sudo tailscaled --tun=userspace-networking --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock &
          sleep 5

          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=colab-win-$GITHUB_RUN_ID

          TS_IP=$(tailscale ip -4)
          echo -e "\n=========================================="
          echo "   THÔNG TIN KẾT NỐI WINDOWS RDP"
          echo "Address  : $TS_IP:3389"
          echo "Username : Administrator"
          echo "Password : Pzkxvu123@"
          echo "==========================================\n"

          # 3. Tải đĩa Windows Lite
          mkdir -p ~/windows
          cd ~/windows
          if [ ! -f "win10.qcow2" ]; then
            echo "Đang tải file đĩa Windows..."
            wget -O win10.qcow2 "https://archive.org/download/win10_qcow2_rdp/win10.qcow2"
          fi

          # 4. Khai tử tiến trình cũ và chạy QEMU cú pháp chuẩn tuyệt đối
          sudo killall -9 qemu-system-x86_64 2>/dev/null || true
          sleep 2

          sudo qemu-system-x86_64 \
            -m 8192 \
            -smp cores=4 \
            -hda /root/windows/win10.qcow2 \
            -net nic,model=virtio \
            -net user,hostfwd=tcp::3389-:3389 \
            -nographic &

          # 5. Duy trì kết nối
          while true; do
            echo "[$(date)] Máy ảo Windows đang chạy trên Colab..."
            sleep 300
          done
