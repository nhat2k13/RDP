name: RDP

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          netsh advfirewall firewall delete rule name="RDP-Pinggy"
          netsh advfirewall firewall add rule name="RDP-Pinggy" dir=in action=allow protocol=TCP localport=3389

          Restart-Service -Name TermService -Force

      - name: Create RDP User with Custom Password
        run: |
          $username = "nhat"
          $password = "Pzkxvu123@"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          
          echo "RDP_USER=$username" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Start Pinggy RDP Tunnel
        run: |
          Invoke-WebRequest https://the.earth.li/~sgtatham/putty/latest/w64/plink.exe -OutFile plink.exe
          $process = Start-Process -FilePath ".\plink.exe" -ArgumentList "-batch -ssh -R 0:localhost:3389 -ServerAliveInterval 10 a.pinggy.io" -RedirectStandardOutput "pinggy.log" -PassThru
          
          Start-Sleep -Seconds 7
          $log = Get-Content pinggy.log -Raw
          $match = [regex]::Match($log, 'tcp://[a-zA-Z0-9\.\-]+\:(\d+)')
          
          if ($match.Success) {
              $cleanUrl = $match.Value -replace "tcp://", ""
              echo "PINGGY_URL=$cleanUrl" >> $env:GITHUB_ENV
          } else {
              $url = (Get-Content pinggy.log | Select-String "tcp://") -replace ".*tcp://", ""
              echo "PINGGY_URL=$url" >> $env:GITHUB_ENV
          }

      - name: Maintain Connection
        run: |
          Write-Host "`n==============================================="
          Write-Host "DIA CHI RDP : $env:PINGGY_URL"
          Write-Host "USERNAME    : $env:RDP_USER"
          Write-Host "PASSWORD    : $env:RDP_PASS"
          Write-Host "===============================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Cancel workflow run to terminate"
              Start-Sleep -Seconds 300
          }
