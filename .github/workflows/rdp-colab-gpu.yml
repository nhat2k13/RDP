name: nhat

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure Core RDP Settings
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force

          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $password = "Pzkxvu123@"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name "RDP" -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member "RDP"
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "RDP"
          
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Install and Start Ngrok via Chocolatey
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          choco install ngrok -y
          
          ngrok config add-authtoken $env:NGROK_AUTH_TOKEN
          
          Start-Process -FilePath "ngrok" -ArgumentList "tcp 3389 --log=stdout" -RedirectStandardOutput "ngrok.log" -RedirectStandardError "ngrok_err.log" -PassThru
          
          $ngrokIP = ""
          $retries = 0
          while (-not $ngrokIP -and $retries -lt 12) {
              Start-Sleep -Seconds 3
              try {
                  $tunnels = Invoke-RestMethod -Uri http://localhost:4040/api/tunnels -ErrorAction Stop
                  if ($tunnels.tunnels.count -gt 0) {
                      $publicUrl = ($tunnels.tunnels | Where-Object {$_.proto -eq 'tcp'}).public_url
                      $ngrokIP = $publicUrl -replace "tcp://", ""
                      break
                  }
              } catch {
                  Write-Host "Dang cho Ngrok khoi tao..."
              }
              $retries++
          }
          
          if (-not $ngrokIP) {
              Write-Host "================= NGROK LOG LORI ================="
              if (Test-Path "ngrok.log") { Get-Content ngrok.log }
              if (Test-Path "ngrok_err.log") { Get-Content ngrok_err.log }
              Write-Host "=================================================="
              Write-Error "Khong the ket noi Ngrok. Hay xem chi tiet log phia tren!"
              exit 1
          }
          echo "NGROK_IP=$ngrokIP" >> $env:GITHUB_ENV

      - name: Maintain Connection
        run: |
          Write-Host "`n==============================================="
          Write-Host "DIA CHI RDP : $env:NGROK_IP"
          Write-Host "USERNAME    : RDP"
          Write-Host "PASSWORD    : $env:RDP_PASS"
          Write-Host "===============================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Cancel workflow run to terminate"
              Start-Sleep -Seconds 300
          }
