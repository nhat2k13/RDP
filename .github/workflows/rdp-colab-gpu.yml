name: Windows-10-QEMU-RDP

on:
  workflow_dispatch:

jobs:
  windows-vm:
    runs-on: self-hosted
    timeout-minutes: 360

    steps:
      - name: Test workflow
        shell: bash
        run: |
          echo "Workflow OK"
          set -e

          cd "$HOME/windows-vm"

          export IMAGE_INDEX="$IMAGE_INDEX"

          python3 <<'PY'
          import os

          username = "RDP"
          password = "Pzkxvu123@"
          computer_name = "NHAT"
          image_index = os.environ["IMAGE_INDEX"]

          xml = f'''<?xml version="1.0" encoding="utf-8"?>
          <unattend xmlns="urn:schemas-microsoft-com:unattend"
                    xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

            <settings pass="windowsPE">

              <component
                name="Microsoft-Windows-International-Core-WinPE"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>

              </component>

              <component
                name="Microsoft-Windows-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <DiskConfiguration>

                  <Disk wcm:action="add">
                    <DiskID>0</DiskID>
                    <WillWipeDisk>true</WillWipeDisk>

                    <CreatePartitions>

                      <CreatePartition wcm:action="add">
                        <Order>1</Order>
                        <Type>EFI</Type>
                        <Size>100</Size>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>2</Order>
                        <Type>MSR</Type>
                        <Size>16</Size>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>3</Order>
                        <Type>Primary</Type>
                        <Extend>true</Extend>
                      </CreatePartition>

                    </CreatePartitions>

                    <ModifyPartitions>

                      <ModifyPartition wcm:action="add">
                        <Order>1</Order>
                        <PartitionID>1</PartitionID>
                        <Format>FAT32</Format>
                        <Label>System</Label>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>2</Order>
                        <PartitionID>2</PartitionID>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>3</Order>
                        <PartitionID>3</PartitionID>
                        <Format>NTFS</Format>
                        <Label>Windows</Label>
                        <Letter>C</Letter>
                      </ModifyPartition>

                    </ModifyPartitions>

                  </Disk>

                  <WillShowUI>OnError</WillShowUI>

                </DiskConfiguration>

                <ImageInstall>

                  <OSImage>

                    <InstallFrom>
                      <MetaData wcm:action="add">
                        <Key>/IMAGE/INDEX</Key>
                        <Value>{image_index}</Value>
                      </MetaData>
                    </InstallFrom>

                    <InstallTo>
                      <DiskID>0</DiskID>
                      <PartitionID>3</PartitionID>
                    </InstallTo>

                    <WillShowUI>OnError</WillShowUI>

                  </OSImage>

                </ImageInstall>

                <UserData>
                  <AcceptEula>true</AcceptEula>
                </UserData>

              </component>

            </settings>

            <settings pass="specialize">

              <component
                name="Microsoft-Windows-Shell-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <ComputerName>{computer_name}</ComputerName>

              </component>

            </settings>

            <settings pass="oobeSystem">

              <component
                name="Microsoft-Windows-Shell-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <UserAccounts>

                  <LocalAccounts>

                    <LocalAccount wcm:action="add">

                      <Name>{username}</Name>
                      <Group>Administrators</Group>

                      <Password>
                        <Value>{password}</Value>
                        <PlainText>true</PlainText>
                      </Password>

                    </LocalAccount>

                  </LocalAccounts>

                </UserAccounts>

                <AutoLogon>
                  <Enabled>true</Enabled>
                  <Username>{username}</Username>
                  <LogonCount>1</LogonCount>

                  <Password>
                    <Value>{password}</Value>
                    <PlainText>true</PlainText>
                  </Password>

                </AutoLogon>

                <OOBE>
                  <HideEULAPage>true</HideEULAPage>
                  <HideOnlineAccountScreens>true</HideOnlineAccountScreens>
                  <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>
                  <NetworkLocation>Work</NetworkLocation>
                  <ProtectYourPC>3</ProtectYourPC>
                </OOBE>

                <FirstLogonCommands>

                  <SynchronousCommand wcm:action="add">
                    <Order>1</Order>
                    <CommandLine>
                      cmd /c netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
                    </CommandLine>
                  </SynchronousCommand>

                  <SynchronousCommand wcm:action="add">
                    <Order>2</Order>
                    <CommandLine>
                      powershell.exe -ExecutionPolicy Bypass -Command "Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0"
                    </CommandLine>
                  </SynchronousCommand>

                  <SynchronousCommand wcm:action="add">
                    <Order>3</Order>
                    <CommandLine>
                      cmd /c net localgroup "Remote Desktop Users" {username} /add
                    </CommandLine>
                  </SynchronousCommand>

                </FirstLogonCommands>

              </component>

            </settings>

          </unattend>
          '''

          with open("Autounattend.xml", "w", encoding="utf-8") as f:
              f.write(xml)

          print("Autounattend.xml created.")
          print("Computer name: NHAT")
          print("Username: RDP")
          PY
