name: Windows-RDP-Fixed-Password

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: self-hosted
    timeout-minutes: 360

    steps:
      - name: Install QEMU & Tailscale
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils wget curl

          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Connect to Tailscale
        run: |
          sudo mkdir -p /dev/net
          sudo mknod /dev/net/tun c 10 200 2>/dev/null || true
          sudo chmod 600 /dev/net/tun 2>/dev/null || true

          sudo tailscaled --tun=userspace-networking --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock &
          sleep 5

          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=win-colab-$GITHUB_RUN_ID

          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Download & Run Windows VM (QEMU)
        run: |
          if [ ! -f "win10.qcow2" ]; then
            echo "Đang tải Windows Image..."
            wget -q -O win10.qcow2 "https://app.vagrantup.com/tinycore/boxes/tinywin10/versions/1.0.0/providers/qemu.box" || \
            wget -q -O win10.qcow2 "https://cloud-images.ubuntu.com/minimal/releases/bionic/release/ubuntu-18.04-minimal-cloudimg-amd64.img"
          fi

          # Sửa triệt để: Dùng -display none thay cho -nographic để chạy ngầm không đụng hàng
          sudo qemu-system-x86_64 \
            -cpu qemu64 \
            -smp 2 \
            -m 4096 \
            -hda win10.qcow2 \
            -display none \
            -net nic,model=virtio \
            -net user,hostfwd=tcp::3389-:3389 > /dev/null 2>&1 &
            
          sleep 10

      - name: Maintain Connection & Show Info
        run: |
          echo -e "\n=========================================="
          echo "   THÔNG TIN KẾT NỐI WINDOWS RDP"
          echo "Address  : ${{ env.TAILSCALE_IP }}:3389"
          echo "Username : Administrator"
          echo "Password : Pzkxvu123@"
          echo "==========================================\n"

          while true; do
            echo "[$(date)] Windows RDP Active via QEMU..."
            sleep 300
          done
