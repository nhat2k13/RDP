name: RDP-Colab-Windows-Docker

on:
  workflow_dispatch:

jobs:
  windows-docker:
    runs-on: self-hosted
    timeout-minutes: 360

    steps:
      - name: Dọn dẹp & Cài đặt Docker
        run: |
          sudo killall apt apt-get dpkg 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock* /var/cache/apt/archives/lock
          sudo dpkg --configure -a

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io curl

          # Khởi động Docker daemon trực tiếp (không dùng systemd/service)
          sudo dockerd > /dev/null 2>&1 &
          sleep 5

      - name: Kết nối Tailscale
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh
          
          sudo mkdir -p /dev/net
          sudo mknod /dev/net/tun c 10 200 2>/dev/null || true
          sudo chmod 600 /dev/net/tun 2>/dev/null || true

          sudo killall tailscaled 2>/dev/null || true
          sleep 2

          sudo tailscaled --tun=userspace-networking --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock &
          sleep 5

          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=colab-win-$GITHUB_RUN_ID

          TS_IP=$(tailscale ip -4)
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Khởi chạy máy ảo Windows
        run: |
          echo -e "\n=========================================="
          echo "   THÔNG TIN KẾT NỐI WINDOWS 10/11"
          echo "Truy cập trình duyệt  : http://$TAILSCALE_IP:8006"
          echo "Hoặc kết nối RDP      : $TAILSCALE_IP:3389"
          echo "Username              : admin"
          echo "Password              : admin"
          echo "==========================================\n"

          # Chạy Docker Windows ngầm
          sudo docker run -d \
            --name windows \
            --cap-add=NET_ADMIN \
            -p 8006:8006 \
            -p 3389:3389/tcp \
            -p 3389:3389/udp \
            -e RAM_SIZE="4G" \
            -e CPU_CORES="2" \
            dockur/windows

          while true; do
            echo "[$(date)] Windows Container đang chạy..."
            sleep 300
          done
