name: ??

on:
  workflow_dispatch:

jobs:
  secure-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Configure RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication" -Value 0 -Force
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer" -Value 0 -Force
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          Restart-Service -Name TermService -Force

      - name: Create RDP User
        run: |
          $username = "nhat"
          $password = "Pzkxvu123@"
          $securePass = ConvertTo-SecureString $password -AsPlainText -Force
          
          New-LocalUser -Name $username -Password $securePass -AccountNeverExpires
          Add-LocalGroupMember -Group "Administrators" -Member $username
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member $username
          
          echo "RDP_USER=$username" >> $env:GITHUB_ENV
          echo "RDP_PASS=$password" >> $env:GITHUB_ENV

      - name: Start Ngrok Official
        env:
          NGROK_AUTH_TOKEN: ${{ secrets.NGROK_AUTH_TOKEN }}
        run: |
          Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath . -Force
          .\ngrok.exe config add-authtoken $env:NGROK_AUTH_TOKEN
          Start-Process -FilePath ".\ngrok.exe" -ArgumentList "tcp 3389 --log=stdout" -RedirectStandardOutput "ngrok.log" -PassThru
          
          $cleanUrl = ""
          $retries = 0
          while ($retries -lt 15) {
              Start-Sleep -Seconds 2
              if (Test-Path "ngrok.log") {
                  $log = Get-Content ngrok.log -Raw
                  if ($log -match 'tcp://[0-9a-z\.\-]+\:[0-9]+') {
                      $cleanUrl = $matches[0] -replace "tcp://", ""
                      break
                  }
              }
              $retries++
          }
          
          echo "NGROK_URL=$cleanUrl" >> $env:GITHUB_ENV

      - name: Maintain Connection
        run: |
          Write-Host "`n==============================================="
          Write-Host "DIA CHI RDP : $env:NGROK_URL"
          Write-Host "USERNAME    : $env:RDP_USER"
          Write-Host "PASSWORD    : $env:RDP_PASS"
          Write-Host "===============================================`n"
          
          while ($true) {
              Write-Host "[$(Get-Date)] RDP Active - Cancel workflow run to terminate"
              Start-Sleep -Seconds 300
          }
