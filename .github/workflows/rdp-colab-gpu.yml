name: Windows-10-QEMU-RDP

on:
  workflow_dispatch:

jobs:
  windows-vm:
    runs-on: self-hosted
    timeout-minutes: 360

    steps:

      # =========================================================
      # 1. CÀI QEMU
      # =========================================================
      - name: Install QEMU
        shell: bash
        run: |
          set -e

          sudo dpkg --configure -a || true
          sudo apt-get update

          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            ovmf \
            xorriso \
            wimtools \
            curl \
            wget \
            ca-certificates

      # =========================================================
      # 2. KIỂM TRA KVM
      # =========================================================
      - name: Check KVM
        shell: bash
        run: |
          echo "Checking KVM..."

          if [ -e /dev/kvm ]; then
            echo "KVM: OK"
            ls -l /dev/kvm
          else
            echo "WARNING: /dev/kvm không tồn tại."
            echo "QEMU sẽ dùng software emulation."
          fi

      # =========================================================
      # 3. TAILSCALE
      # =========================================================
      - name: Install and connect Tailscale
        shell: bash
        run: |
          set -e

          if ! command -v tailscale >/dev/null 2>&1; then
            curl -fsSL https://tailscale.com/install.sh | sh
          fi

          # Nếu tailscaled đã chạy thì không khởi động lại
          if ! pgrep -x tailscaled >/dev/null 2>&1; then

            sudo mkdir -p /dev/net

            if [ ! -e /dev/net/tun ]; then
              sudo mknod /dev/net/tun c 10 200 || true
            fi

            sudo chmod 600 /dev/net/tun || true

            # Ưu tiên TUN bình thường
            sudo tailscaled \
              --state=/var/lib/tailscale/tailscaled.state \
              --socket=/var/run/tailscale/tailscaled.sock &

            sleep 5

          else
            echo "tailscaled đang chạy."
          fi

          sudo tailscale up \
            --authkey="${{ secrets.TAILSCALE_AUTH_KEY }}" \
            --hostname="windows10-$GITHUB_RUN_ID"

          TS_IP=$(sudo tailscale ip -4)

          if [ -z "$TS_IP" ]; then
            echo "Không lấy được Tailscale IP."
            exit 1
          fi

          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

          echo "Tailscale IP: $TS_IP"

      # =========================================================
      # 4. TẠO THƯ MỤC VM
      # =========================================================
      - name: Prepare VM directory
        shell: bash
        run: |
          set -e

          rm -rf "$HOME/windows-vm"
          mkdir -p "$HOME/windows-vm"

          echo "VM directory:"
          echo "$HOME/windows-vm"

      # =========================================================
      # 5. TẢI WINDOWS 10 ENTERPRISE EVALUATION
      #
      # ISO nằm trên Microsoft download CDN
      # =========================================================
      - name: Download Windows 10 ISO
        shell: bash
        run: |
          set -e

          cd "$HOME/windows-vm"

          ISO_URL="https://software-static.download.prss.microsoft.com/dbazure/988969d5-f34g-4e03-ac9d-1f9786c66750/19045.2006.220908-0225.22h2_release_svc_refresh_CLIENTENTERPRISEEVAL_OEMRET_x64FRE_en-us.iso"

          echo "Downloading Windows 10 ISO..."

          curl \
            -L \
            --fail \
            --retry 5 \
            --retry-delay 5 \
            --progress-bar \
            -o windows.iso \
            "$ISO_URL"

          if [ ! -s windows.iso ]; then
            echo "Tải ISO thất bại."
            exit 1
          fi

          echo "Windows ISO downloaded:"
          ls -lh windows.iso

      # =========================================================
      # 6. KIỂM TRA ISO
      # =========================================================
      - name: Verify ISO
        shell: bash
        run: |
          set -e

          cd "$HOME/windows-vm"

          SIZE=$(stat -c%s windows.iso)

          echo "ISO size: $SIZE bytes"

          # ISO Windows phải lớn hơn 3GB
          if [ "$SIZE" -lt 3000000000 ]; then
            echo "File quá nhỏ, không giống ISO Windows."
            exit 1
          fi

          SHA256=$(sha256sum windows.iso | awk '{print toupper($1)}')

          echo "SHA256:"
          echo "$SHA256"

          EXPECTED="EF7312733A9F5D7D51CFA04AC497671995674CA5E1058D5164D6028F0938D668"

          if [ "$SHA256" != "$EXPECTED" ]; then
            echo "SHA256 không khớp."
            exit 1
          fi

          echo "ISO verification OK."

      # =========================================================
      # 7. XÁC ĐỊNH WINDOWS IMAGE
      # =========================================================
      - name: Detect Windows image
        shell: bash
        run: |
          set -e

          cd "$HOME/windows-vm"

          sudo mkdir -p /mnt/windows-iso

          sudo mount -o loop,ro windows.iso /mnt/windows-iso

          if [ -f /mnt/windows-iso/sources/install.wim ]; then
            IMAGE_FILE="/mnt/windows-iso/sources/install.wim"

          elif [ -f /mnt/windows-iso/sources/install.esd ]; then
            IMAGE_FILE="/mnt/windows-iso/sources/install.esd"

          else
            echo "Không tìm thấy install.wim/install.esd."
            sudo umount /mnt/windows-iso || true
            exit 1
          fi

          echo "Image file:"
          echo "$IMAGE_FILE"

          wiminfo "$IMAGE_FILE" | tee image-info.txt

          IMAGE_INDEX=$(
            wiminfo "$IMAGE_FILE" |
            awk '
              /Index:/ {
                idx=$2
              }

              /Name:/ {
                if ($0 ~ /Windows 10 Enterprise/) {
                  print idx
                  exit
                }
              }
            '
          )

          if [ -z "$IMAGE_INDEX" ]; then
            IMAGE_INDEX=$(
              wiminfo "$IMAGE_FILE" |
              awk '/Index:/ {print $2; exit}'
            )
          fi

          if [ -z "$IMAGE_INDEX" ]; then
            echo "Không tìm được Windows image index."
            sudo umount /mnt/windows-iso || true
            exit 1
          fi

          echo "IMAGE_INDEX=$IMAGE_INDEX"

          echo "IMAGE_INDEX=$IMAGE_INDEX" >> "$GITHUB_ENV"

          sudo umount /mnt/windows-iso

      # =========================================================
      # 8. TẠO AUTOUNATTEND
      #
      # Máy: NHAT
      # User: RDP
      # Password: Pzkxvu123@
      # =========================================================
      - name: Create Autounattend.xml
        shell: bash
        run: |
          set -e

          cd "$HOME/windows-vm"

          python3 <<'PY'
          import os

          username = "RDP"
          password = "Pzkxvu123@"
          computer_name = "NHAT"
          image_index = os.environ["IMAGE_INDEX"]

          xml = f'''<?xml version="1.0" encoding="utf-8"?>

          <unattend
            xmlns="urn:schemas-microsoft-com:unattend"
            xmlns:wcm="http://schemas.microsoft.com/WMIConfig/2002/State">

            <!-- ================================================= -->
            <!-- WINDOWS PE -->
            <!-- ================================================= -->

            <settings pass="windowsPE">

              <component
                name="Microsoft-Windows-International-Core-WinPE"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <InputLocale>en-US</InputLocale>
                <SystemLocale>en-US</SystemLocale>
                <UILanguage>en-US</UILanguage>
                <UserLocale>en-US</UserLocale>

              </component>

              <component
                name="Microsoft-Windows-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <DiskConfiguration>

                  <Disk wcm:action="add">

                    <DiskID>0</DiskID>
                    <WillWipeDisk>true</WillWipeDisk>

                    <CreatePartitions>

                      <CreatePartition wcm:action="add">
                        <Order>1</Order>
                        <Type>EFI</Type>
                        <Size>100</Size>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>2</Order>
                        <Type>MSR</Type>
                        <Size>16</Size>
                      </CreatePartition>

                      <CreatePartition wcm:action="add">
                        <Order>3</Order>
                        <Type>Primary</Type>
                        <Extend>true</Extend>
                      </CreatePartition>

                    </CreatePartitions>

                    <ModifyPartitions>

                      <ModifyPartition wcm:action="add">
                        <Order>1</Order>
                        <PartitionID>1</PartitionID>
                        <Format>FAT32</Format>
                        <Label>System</Label>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>2</Order>
                        <PartitionID>2</PartitionID>
                      </ModifyPartition>

                      <ModifyPartition wcm:action="add">
                        <Order>3</Order>
                        <PartitionID>3</PartitionID>
                        <Format>NTFS</Format>
                        <Label>Windows</Label>
                        <Letter>C</Letter>
                      </ModifyPartition>

                    </ModifyPartitions>

                  </Disk>

                  <WillShowUI>OnError</WillShowUI>

                </DiskConfiguration>

                <ImageInstall>

                  <OSImage>

                    <InstallFrom>

                      <MetaData wcm:action="add">
                        <Key>/IMAGE/INDEX</Key>
                        <Value>{image_index}</Value>
                      </MetaData>

                    </InstallFrom>

                    <InstallTo>
                      <DiskID>0</DiskID>
                      <PartitionID>3</PartitionID>
                    </InstallTo>

                    <WillShowUI>OnError</WillShowUI>

                  </OSImage>

                </ImageInstall>

                <UserData>
                  <AcceptEula>true</AcceptEula>
                </UserData>

              </component>

            </settings>


            <!-- ================================================= -->
            <!-- SPECIALIZE -->
            <!-- ================================================= -->

            <settings pass="specialize">

              <component
                name="Microsoft-Windows-Shell-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <ComputerName>NHAT</ComputerName>

              </component>

              <component
                name="Microsoft-Windows-Deployment"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <RunSynchronous>

                  <RunSynchronousCommand wcm:action="add">

                    <Order>1</Order>

                    <Path>
                      cmd /c netsh advfirewall firewall set rule group="remote desktop" new enable=Yes
                    </Path>

                  </RunSynchronousCommand>

                  <RunSynchronousCommand wcm:action="add">

                    <Order>2</Order>

                    <Path>
                      powershell.exe -ExecutionPolicy Bypass -Command "Set-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Terminal Server' -Name fDenyTSConnections -Value 0"
                    </Path>

                  </RunSynchronousCommand>

                </RunSynchronous>

              </component>

            </settings>


            <!-- ================================================= -->
            <!-- OOBE -->
            <!-- ================================================= -->

            <settings pass="oobeSystem">

              <component
                name="Microsoft-Windows-Shell-Setup"
                processorArchitecture="amd64"
                publicKeyToken="31bf3856ad364e35"
                language="neutral"
                versionScope="nonSxS">

                <UserAccounts>

                  <LocalAccounts>

                    <LocalAccount wcm:action="add">

                      <Name>RDP</Name>

                      <Group>Administrators</Group>

                      <Password>

                        <Value>Pzkxvu123@</Value>

                        <PlainText>true</PlainText>

                      </Password>

                    </LocalAccount>

                  </LocalAccounts>

                </UserAccounts>

                <AutoLogon>

                  <Enabled>true</Enabled>

                  <Username>RDP</Username>

                  <LogonCount>1</LogonCount>

                  <Password>

                    <Value>Pzkxvu123@</Value>

                    <PlainText>true</PlainText>

                  </Password>

                </AutoLogon>

                <OOBE>

                  <HideEULAPage>true</HideEULAPage>

                  <HideOnlineAccountScreens>true</HideOnlineAccountScreens>

                  <HideWirelessSetupInOOBE>true</HideWirelessSetupInOOBE>

                  <NetworkLocation>Work</NetworkLocation>

                  <ProtectYourPC>3</ProtectYourPC>

                </OOBE>

                <FirstLogonCommands>

                  <SynchronousCommand wcm:action="add">

                    <Order>1</Order>

                    <CommandLine>
                      cmd /c net localgroup "Remote Desktop Users" RDP /add
                    </CommandLine>

                  </SynchronousCommand>

                </FirstLogonCommands>

              </component>

            </settings>

          </unattend>
          '''

          with open("Autounattend.xml", "w", encoding="utf-8") as f:
              f.write(xml)

          print("Autounattend.xml created.")
          print("Computer name: NHAT")
          print("Username: RDP")
          PY

      # =========================================================
      # 9. TẠO ISO AUTOUNATTEND
      # =========================================================
      - name: Create unattended ISO
        shell: bash
        run: |
          set -e

          cd "$HOME/windows-vm"

          xorriso \
            -as mkisofs \
            -iso-level 3 \
            -V AUTOUNATTEND \
            -o unattended.iso \
            Autounattend.xml

          ls -lh unattended.iso

      # =========================================================
      # 10. TẠO Ổ CỨNG 80GB
      # =========================================================
      - name: Create Windows disk
        shell: bash
        run: |
          set -e

          cd "$HOME/windows-vm"

          qemu-img create \
            -f qcow2 \
            windows.qcow2 \
            80G

          qemu-img info windows.qcow2

      # =========================================================
      # 11. UEFI
      # =========================================================
      - name: Prepare UEFI
        shell: bash
        run: |
          set -e

          cd "$HOME/windows-vm"

          cp \
            /usr/share/OVMF/OVMF_VARS.fd \
            OVMF_VARS.fd

      # =========================================================
      # 12. KHỞI ĐỘNG WINDOWS
      # =========================================================
      - name: Start Windows 10 VM
        shell: bash
        run: |
          set -e

          cd "$HOME/windows-vm"

          if [ -e /dev/kvm ]; then
            ACCEL="-enable-kvm"
            CPU="host"
            echo "Using KVM acceleration."
          else
            ACCEL=""
            CPU="qemu64"
            echo "Using software emulation."
          fi

          sudo qemu-system-x86_64 \
            $ACCEL \
            -machine q35 \
            -cpu "$CPU" \
            -smp 4 \
            -m 8G \
            \
            -drive "if=pflash,format=raw,readonly=on,file=/usr/share/OVMF/OVMF_CODE.fd" \
            \
            -drive "if=pflash,format=raw,file=$HOME/windows-vm/OVMF_VARS.fd" \
            \
            -drive "file=$HOME/windows-vm/windows.qcow2,if=ide,format=qcow2" \
            \
            -drive "media=cdrom,readonly=on,file=$HOME/windows-vm/windows.iso" \
            \
            -drive "media=cdrom,readonly=on,file=$HOME/windows-vm/unattended.iso" \
            \
            -nic "user,model=e1000,hostfwd=tcp:127.0.0.1:13389-:3389" \
            \
            -display none \
            \
            -vnc 127.0.0.1:5900 \
            \
            -daemonize \
            \
            -pidfile "$HOME/windows-vm/qemu.pid" \
            \
            -D "$HOME/windows-vm/qemu.log"

          sleep 15

          if ! sudo kill -0 "$(cat "$HOME/windows-vm/qemu.pid")" 2>/dev/null; then

            echo "QEMU không chạy."

            sudo cat "$HOME/windows-vm/qemu.log" || true

            exit 1

          fi

          echo "Windows 10 VM started."

      # =========================================================
      # 13. TAILSCALE SERVE TCP → QEMU RDP
      # =========================================================
      - name: Expose RDP through Tailscale
        shell: bash
        run: |
          set -e

          # Xóa cấu hình Serve cũ nếu có
          sudo tailscale serve reset || true

          # TCP 13389 của tailnet
          # → localhost:13389
          # → QEMU
          # → Windows RDP :3389
          sudo tailscale serve \
            --tcp=13389 \
            --bg \
            tcp://127.0.0.1:13389

          echo "Tailscale TCP forwarding configured."

      # =========================================================
      # 14. CHỜ WINDOWS
      # =========================================================
      - name: Wait for Windows RDP
        shell: bash
        run: |
          set +e

          echo "Waiting for Windows..."

          for i in $(seq 1 90); do

            if timeout 2 bash -c \
              '</dev/tcp/127.0.0.1/13389' \
              2>/dev/null
            then

              echo "RDP port is open."

              exit 0

            fi

            echo "[$i/90] Windows chưa sẵn sàng..."

            sleep 10

          done

          echo "RDP chưa mở."

          exit 1

      # =========================================================
      # 15. THÔNG TIN ĐĂNG NHẬP
      # =========================================================
      - name: Connection information
        shell: bash
        run: |
          TS_IP=$(sudo tailscale ip -4)

          echo ""
          echo "=============================================="
          echo "             WINDOWS 10 QEMU VM"
          echo "=============================================="
          echo ""
          echo "Computer name : NHAT"
          echo "Username      : RDP"
          echo "Password      : Pzkxvu123@"
          echo ""
          echo "Tailscale IP  : $TS_IP"
          echo "RDP port      : 13389"
          echo ""
          echo "RDP address:"
          echo "$TS_IP:13389"
          echo ""
          echo "=============================================="

      # =========================================================
      # 16. GIỮ VM CHẠY
      # =========================================================
      - name: Keep VM alive
        shell: bash
        run: |
          while sudo kill -0 "$(cat "$HOME/windows-vm/qemu.pid")" 2>/dev/null; do

            echo "[$(date)] Windows 10 VM đang chạy..."

            sleep 300

          done

          echo "Windows VM stopped."

      # =========================================================
      # 17. QEMU LOG
      # =========================================================
      - name: Show QEMU log
        if: always()
        shell: bash
        run: |
          if [ -f "$HOME/windows-vm/qemu.log" ]; then

            echo "========== QEMU LOG =========="

            sudo cat "$HOME/windows-vm/qemu.log"

          fi
