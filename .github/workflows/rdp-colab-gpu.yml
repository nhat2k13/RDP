name: RDP-Colab-Fast-Desktop

on:
  workflow_dispatch:

jobs:
  fast-rdp:
    runs-on: self-hosted
    timeout-minutes: 360

    steps:
      - name: Dọn dẹp & Cài đặt XFCE4 + XRDP
        run: |
          sudo killall apt apt-get dpkg 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock* /var/cache/apt/archives/lock
          sudo dpkg --configure -a

          sudo ln -snf /usr/share/zoneinfo/Asia/Ho_Chi_Minh /etc/localtime
          echo "Asia/Ho_Chi_Minh" | sudo tee /etc/timezone

          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xrdp dbus-x11 curl

          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Tạo tài khoản RDP
        run: |
          USERNAME="RDP"
          PASSWORD="Pzkxvu123@"
          
          sudo id -u $USERNAME &>/dev/null || sudo useradd -m -s /bin/bash $USERNAME
          echo "$USERNAME:$PASSWORD" | sudo chpasswd
          sudo usermod -aG sudo $USERNAME
          
          echo "startxfce4" | sudo tee /home/$USERNAME/.xsession
          sudo chown $USERNAME:$USERNAME /home/$USERNAME/.xsession
          
          sudo systemctl restart xrdp 2>/dev/null || sudo /etc/init.d/xrdp restart

      - name: Kết nối Tailscale
        run: |
          sudo mkdir -p /dev/net
          sudo mknod /dev/net/tun c 10 200 2>/dev/null || true
          sudo chmod 600 /dev/net/tun 2>/dev/null || true

          sudo killall tailscaled 2>/dev/null || true
          sleep 2

          sudo tailscaled --tun=userspace-networking --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock &
          sleep 5

          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=colab-rdp-$GITHUB_RUN_ID

          TS_IP=$(tailscale ip -4)
          if [ -z "$TS_IP" ]; then
            echo "Kết nối Tailscale thất bại!"
            exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Duy trì kết nối RDP
        run: |
          echo -e "\n=========================================="
          echo "   THÔNG TIN KẾT NỐI RDP DESKTOP"
          echo "Address  : $TAILSCALE_IP"
          echo "Username : RDP"
          echo "Password : Pzkxvu123@"
          echo "==========================================\n"

          while true; do
            echo "[$(date)] RDP is active on Colab..."
            sleep 300
          done
