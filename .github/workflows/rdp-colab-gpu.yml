name: RDP-Colab-Windows-GPU-T4

on:
  workflow_dispatch:

jobs:
  windows-rdp:
    runs-on: self-hosted
    timeout-minutes: 360

    steps:
      - name: Install QEMU & Tailscale Dependencies
        run: |
          # 1. Dọn dẹp tiến trình apt/dpkg kẹt
          sudo killall apt apt-get dpkg 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock* /var/cache/apt/archives/lock
          sudo dpkg --configure -a

          # 2. Cài đặt múi giờ Việt Nam
          sudo ln -snf /usr/share/zoneinfo/Asia/Ho_Chi_Minh /etc/localtime
          echo "Asia/Ho_Chi_Minh" | sudo tee /etc/timezone

          # 3. Cài đặt các công cụ cần thiết
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y qemu-system-x86 qemu-utils wget curl

          # 4. Cài đặt Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh

      - name: Download Windows Disk Image
        run: |
          mkdir -p ~/windows
          cd ~/windows
          echo "Đang tải file đĩa ảo Windows 10..."
          wget -O win10.qcow2 "https://archive.org/download/win10_qcow2_rdp/win10.qcow2" || \
          curl -L -o win10.qcow2 "https://cloud-images.ubuntu.com/minimal/releases/focal/release/ubuntu-20.04-minimal-cloudimg-amd64.img"

      - name: Connect to Tailscale
        run: |
          # Khai báo thiết bị tun và khởi động dịch vụ Tailscale
          sudo mkdir -p /dev/net
          sudo mknod /dev/net/tun c 10 200 2>/dev/null || true
          sudo chmod 600 /dev/net/tun 2>/dev/null || true

          # Dọn dẹp tiến trình Tailscale cũ nếu có
          sudo killall tailscaled 2>/dev/null || true
          sleep 2

          sudo tailscaled --tun=userspace-networking --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock &
          sleep 5

          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=colab-win10-$GITHUB_RUN_ID

          TS_IP=$(tailscale ip -4)
          if [ -z "$TS_IP" ]; then
            echo "Kết nối Tailscale thất bại!"
            exit 1
          fi
          echo "TAILSCALE_IP=$TS_IP" >> $GITHUB_ENV

      - name: Start Windows Machine & Maintain Connection
        run: |
          echo -e "\n=========================================="
          echo "   THÔNG TIN KẾT NỐI WINDOWS 10 RDP"
          echo "Address  : $TAILSCALE_IP:3389"
          echo "Username : Administrator"
          echo "Password : Pzkxvu123@"
          echo "==========================================\n"

          # Chạy máy ảo QEMU ở chế độ mô phỏng phần cứng không dùng KVM
          sudo qemu-system-x86_64 \
            -m 8192 \
            -smp cores=4 \
            -hda ~/windows/win10.qcow2 \
            -net nic,model=virtio \
            -net user,hostfwd=tcp::3389-:3389 \
            -vga vmware \
            -daemonize

          # Giữ tiến trình để duy trì máy ảo
          while true; do
            echo "[$(date)] Windows 10 RDP is running on Colab..."
            sleep 300
          done
