name: secure-rdp-gpu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 360

    steps:
      - name: Configure Vietnam Timezone, GPU Drivers & Desktop Environment
        run: |
          # 1. Giải phóng khóa apt/dpkg bị kẹt
          sudo killall apt apt-get dpkg 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock* /var/cache/apt/archives/lock
          sudo dpkg --configure -a

          # 2. Cài đặt múi giờ Việt Nam
          sudo ln -snf /usr/share/zoneinfo/Asia/Ho_Chi_Minh /etc/localtime
          echo "Asia/Ho_Chi_Minh" | sudo tee /etc/timezone

          # 3. Cài đặt XFCE4, XRDP và các thư viện OpenGL của NVIDIA
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y xfce4 xfce4-goodies xrdp mesa-utils dbus-x11 x11-xserver-utils
          
          # 4. Ép cấu hình Xorg sử dụng GPU NVIDIA T4 làm Card render chính
          sudo nvidia-xconfig --allow-empty-initial-configuration --virtual=1920x1080 || true

      - name: Install Steam & 32-bit Architecture Support
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y steam libgl1-mesa-dri:i386 libgl1-mesa-glx:i386

      - name: Create RDP User
        run: |
          # Tạo user rdpuser nếu chưa có
          if ! id "rdpuser" &>/dev/null; then
            sudo useradd -m -s /bin/bash rdpuser
            echo "rdpuser:123456" | sudo chpasswd
            sudo usermod -aG sudo rdpuser
          fi
          
          # Ép môi trường XFCE4 và biến GPU NVIDIA cho User
          echo "xfce4-session" > /home/rdpuser/.xsession
          echo "export __NV_PRIME_RENDER_OFFLOAD=1" >> /home/rdpuser/.bashrc
          echo "export __GLX_VENDOR_LIBRARY_NAME=nvidia" >> /home/rdpuser/.bashrc
          echo "export __NV_PRIME_RENDER_OFFLOAD=1" >> /home/rdpuser/.profile
          echo "export __GLX_VENDOR_LIBRARY_NAME=nvidia" >> /home/rdpuser/.profile
          sudo chown -R rdpuser:rdpuser /home/rdpuser

      - name: Connect Tailscale & Start GPU RDP
        run: |
          # Khởi chạy Tailscale
          curl -fsSL https://tailscale.com/install.sh | sh
          sudo mkdir -p /dev/net
          sudo mknod /dev/net/tun c 10 200 2>/dev/null || true
          sudo tailscaled --tun=userspace-networking --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock &
          sleep 5
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=colab-gpu-$GITHUB_RUN_ID

          # Khởi động dịch vụ XRDP
          sudo adduser xrdp ssl-cert
          sudo service xrdp restart

          TS_IP=$(tailscale ip -4)
          echo -e "\n=================================================="
          echo "   KẾT NỐI RDP GPU NATIVE THÀNH CÔNG"
          echo "   IP Tailscale : $TS_IP"
          echo "   Username     : rdpuser"
          echo "   Password     : 123456"
          echo "==================================================\n"

          while true; do
            echo "[$(date)] RDP GPU Running..."
            sleep 300
          done
