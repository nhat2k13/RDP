name: secure-rdp-gpu

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 360

    steps:
      - name: Setup Fast Desktop & Dependencies
        run: |
          # 1. Giải phóng hoàn toàn các tiến trình apt/dpkg bị kẹt
          sudo killall apt apt-get dpkg 2>/dev/null || true
          sudo rm -f /var/lib/apt/lists/lock /var/lib/dpkg/lock* /var/cache/apt/archives/lock
          sudo dpkg --configure -a

          # 2. Bật kiến trúc 32-bit cho Steam & cập nhật hệ thống
          sudo dpkg --add-architecture i386
          sudo apt-get update -o Acquire::Retries=3

          # 3. Cài đặt XFCE4, XRDP, Steam và thư viện đồ họa
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            xfce4 xfce4-goodies xrdp dbus-x11 x11-xserver-utils mesa-utils \
            steam libgl1-mesa-dri:i386 libgl1-mesa-glx:i386

      - name: Fix NVIDIA Driver Mismatch
        run: |
          # Reload Kernel Module sửa lỗi NVML Mismatch
          sudo rmmod nvidia_uvm nvidia_drm nvidia_modeset nvidia 2>/dev/null || true
          sudo modprobe nvidia || true
          nvidia-smi

      - name: Configure User 'nhat' & GPU Offload
        run: |
          # Tạo user nhat đồng bộ với log
          if ! id "nhat" &>/dev/null; then
            sudo useradd -m -s /bin/bash nhat
            echo "nhat:123456" | sudo chpasswd
            sudo usermod -aG sudo nhat
          fi

          # Khởi tạo môi trường desktop XFCE4 cho user nhat
          echo "startxfce4" > /home/nhat/.xsession
          echo "export __NV_PRIME_RENDER_OFFLOAD=1" >> /home/nhat/.bashrc
          echo "export __GLX_VENDOR_LIBRARY_NAME=nvidia" >> /home/nhat/.bashrc
          echo "export __NV_PRIME_RENDER_OFFLOAD=1" >> /home/nhat/.profile
          echo "export __GLX_VENDOR_LIBRARY_NAME=nvidia" >> /home/nhat/.profile
          
          # Cấp quyền hoàn toàn cho thư mục home của nhat
          sudo chown -R nhat:nhat /home/nhat
          sudo chmod +x /home/nhat/.xsession

      - name: Install Tailscale & Start RDP
        run: |
          curl -fsSL https://tailscale.com/install.sh | sh

          sudo mkdir -p /dev/net
          sudo mknod /dev/net/tun c 10 200 2>/dev/null || true
          sudo tailscaled --tun=userspace-networking --state=/var/lib/tailscale/tailscaled.state --socket=/var/run/tailscale/tailscaled.sock &
          sleep 5
          sudo tailscale up --authkey=${{ secrets.TAILSCALE_AUTH_KEY }} --hostname=colab-gpu-$GITHUB_RUN_ID

          sudo adduser xrdp ssl-cert
          sudo service xrdp restart

          TS_IP=$(tailscale ip -4)
          echo -e "\n=================================================="
          echo "   KẾT NỐI RDP GPU THÀNH CÔNG"
          echo "   IP Tailscale : $TS_IP"
          echo "   Username     : nhat"
          echo "   Password     : 123456"
          echo "==================================================\n"

          while true; do
            echo "[$(date)] RDP Active with GPU..."
            sleep 300
          done
